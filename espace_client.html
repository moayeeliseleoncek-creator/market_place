<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="espace_client.css">
    <title>Espace Client</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        .grille-articles {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        @media (min-width: 700px) {
            .grille-articles {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .grille-articles {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 22px;
            }
        }

        .carte-article {
            background: white;
            border-radius: 14px;
            border: 1px solid #ece5df;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-width: 0;
        }

        .carte-article:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(0,0,0,0.14);
        }

        .carte-article img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #f0f0f0;
            display: block;
        }

        .carte-article .no-photo {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .carte-info {
            padding: 14px;
        }

        .carte-categorie {
            font-size: 10.5px;
            font-weight: bold;
            color: #ff5e00;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .carte-nom {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            margin-bottom: 5px;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .carte-desc {
            font-size: 12.5px;
            color: #666;
            line-height: 1.45;
            margin-bottom: 9px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .carte-prix {
            font-size: 16px;
            font-weight: bold;
            color: #8b2d00;
            margin-bottom: 10px;
        }

        .carte-btn {
            display: block;
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            line-height: 1.3;
        }

        .carte-btn:hover {
            background: #1da851;
        }

        /* Petits téléphones : les cartes restent bien lisibles, juste un peu resserrées */
        @media (max-width: 380px) {
            .grille-articles { gap: 12px; }
            .carte-article img,
            .carte-article .no-photo { height: 120px; }
            .carte-info { padding: 10px; }
            .carte-nom { font-size: 13.5px; }
            .carte-desc { font-size: 11.5px; }
            .carte-prix { font-size: 14px; }
        }

        /* CHARGEMENT */
        .chargement {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }

        /* BADGE NOMBRE DE PHOTOS */
        .carte-image {
            position: relative;
        }

        .badge-photos {

            right: 8px;
            bottom: 8px;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 11px;
            font-weight: bold;

            border-radius: 999px;
        }

        /* GALERIE PLEIN ÉCRAN */
        .galerie-overlay {

            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(10,8,6,0.92);
            padding: 24px;
            align-items: center;
            justify-content: center;
        }

        .galerie-overlay.ouverte {
            display: flex;
        }

        .galerie-boite {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .galerie-haut {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }

        .galerie-titre {
            font-size: 15px;
            font-weight: bold;
        }

        .galerie-fermer {

            border: none;

            border-radius: 50%;

            cursor: pointer;
        }

        .galerie-cadre {

            align-items: center;
            justify-content: center;
        }

        .galerie-cadre img {
            max-width: 100%;
            max-height: 62vh;
            border-radius: 10px;
            background: #150e0a;
            object-fit: contain;
        }

        .galerie-fleche {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.14);
            color: #fff;
            border: none;
            width: 40px;

        .galerie-precedent { left: -6px; }

        .galerie-miniatures {

        .galerie-miniatures img {

        /* Sélecteurs taille / couleur dans la fenêtre de commande */

            font-weight: bold;

            background: #faf9f8;

        .commande-overlay {

    <script>
        (function () {
            var burger = document.getElementById("btn_nav_burger");
            var menu = document.getElementById("menu_principal");
            if (!burger || !menu) { return; }

            function fermerMenu() {
                menu.classList.remove("menu-ouvert");
                burger.classList.remove("actif");
                burger.setAttribute("aria-expanded", "false");
            }

            burger.addEventListener("click", function (e) {
                e.stopPropagation();
                var ouvert = menu.classList.toggle("menu-ouvert");
                burger.classList.toggle("actif", ouvert);
                burger.setAttribute("aria-expanded", ouvert ? "true" : "false");
            });

            menu.querySelectorAll("a").forEach(function (lien) {
                lien.addEventListener("click", fermerMenu);
            });

            document.addEventListener("click", function (e) {
                if (!menu.contains(e.target) && e.target !== burger) { fermerMenu(); }
            });

            window.addEventListener("resize", function () {
                if (window.innerWidth > 900) { fermerMenu(); }
            });
        })();
    </script>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0AD4E1t_YuQLHOgsEOy_wQKZ4l9ycrMo",
            authDomain: "esetec-marketplace.firebaseapp.com",
            projectId: "esetec-marketplace",
            storageBucket: "esetec-marketplace.firebasestorage.app",
            messagingSenderId: "480104714016",
            appId: "1:480104714016:web:c8b923f80c103701385145",
            databaseURL: "https://esetec-marketplace-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db  = getDatabase(app);

        // Stocke tous les articles pour la recherche
        var tousLesArticles = [];

        // Stocke les infos vendeurs (photo, etc.) par email, pour la fenêtre de commande
        var vendeursParEmail = {};
        // Article actuellement affiché dans la fenêtre de commande
        var articleCommandeActuel = null;
        onValue(ref(db, "vendeurs"), function(snapshot) {
            vendeursParEmail = {};
            if (snapshot.exists()) {
                snapshot.forEach(function(enfant) {
                    var v = enfant.val();
                    var cle = (v.email || "").trim().toLowerCase();
                    if (cle) vendeursParEmail[cle] = v;
                });
            }
        });

        // Écoute les articles en temps réel
        var articlesRef = ref(db, "articles");

        onValue(articlesRef, function(snapshot) {
            tousLesArticles = [];

            if (snapshot.exists()) {
                snapshot.forEach(function(enfant) {
                    var article = enfant.val();
                    article.id = enfant.key;
                    tousLesArticles.push(article);
                });
                // Trier du plus récent au plus ancien
                tousLesArticles.reverse();
            }

            if (appliquerCategorieDepuisURL()) {
                filtrerArticles();
            } else {
                afficherArticles(tousLesArticles);
            }
        });

        // ══════════════════════════════════════
        // CAROUSEL PUBLICITAIRE (géré depuis l'espace admin)
        // ══════════════════════════════════════
        var toutesLesPubs = [];
        var pubCourante = 0;
        var pubIndexAffiche = null;
        var minuteurPub = null;
        var rechercheActive = false;

        onValue(ref(db, "publicites"), function(snapshot) {
            var liste = [];
            if (snapshot.exists()) {
                snapshot.forEach(function(enfant) {
                    var p = enfant.val();
                    p.id = enfant.key;
                    if (p.actif !== false) liste.push(p);
                });
                liste.sort(function(a, b) { return (a.ordre || 0) - (b.ordre || 0); });
            }
            toutesLesPubs = liste;
            afficherPubs();
        });

        function afficherPubs() {
            var conteneurSlides = document.getElementById("pub_slides");
            var conteneurDots = document.getElementById("pub_dots");

            conteneurSlides.innerHTML = "";
            conteneurDots.innerHTML = "";

            if (toutesLesPubs.length === 0) {
                pubCourante = 0;
                pubIndexAffiche = null;
                miseAJourAffichagePub();
                return;
            }

            toutesLesPubs.forEach(function(pub, index) {
                var slide = document.createElement("div");
                slide.className = "pub-slide";
                slide.style.backgroundImage = "url('" + pub.image + "')";
                slide.onclick = function() {
                    if (pub.idArticle) {
                        window.ouvrirCommande(pub.idArticle);
                    } else if (pub.lien) {
                        window.open(pub.lien, "_blank");
                    }
                };

                if (pub.titre || pub.texte) {
                    var legende = document.createElement("div");
                    legende.className = "pub-legende";
                    legende.innerHTML =
                        (pub.titre ? "<div class='pub-titre'>" + pub.titre + "</div>" : "") +
                        (pub.texte ? "<div class='pub-texte'>" + pub.texte + "</div>" : "");
                    slide.appendChild(legende);
                }

                conteneurSlides.appendChild(slide);

                var dot = document.createElement("button");
                dot.type = "button";
                dot.className = "pub-dot" + (index === 0 ? " is-active" : "");
                dot.setAttribute("aria-label", "Aller à la publicité " + (index + 1));
                dot.onclick = function() { allerAPub(index); };
                conteneurDots.appendChild(dot);
            });

            pubCourante = 0;
            pubIndexAffiche = null;
            afficherPubCourante();
            miseAJourAffichagePub();
        }

        // Positionne une slide : 'gauche' (-100%), 'centre' (0%) ou 'droite' (100%)
        function positionnerPubSlide(slide, position, sansTransition) {
            if (!slide) return;
            var valeurs = { gauche: "-100%", centre: "0%", droite: "100%" };
            if (sansTransition) {
                slide.style.transition = "none";
                slide.style.transform = "translateX(" + valeurs[position] + ")";
                void slide.offsetHeight; // force le reflow avant de réactiver la transition
                slide.style.transition = "";
            } else {
                slide.style.transform = "translateX(" + valeurs[position] + ")";
            }
        }

        // Affiche la publicité courante avec un glissement horizontal.
        // direction "avant" : l'ancienne glisse à gauche, la nouvelle entre par la droite.
        // direction "arriere" : l'ancienne glisse à droite, la nouvelle entre par la gauche.
        function afficherPubCourante(direction) {
            var slides = document.querySelectorAll("#pub_slides .pub-slide");
            var dots = document.querySelectorAll("#pub_dots .pub-dot");

            dots.forEach(function(d, i) { d.classList.toggle("is-active", i === pubCourante); });

            if (pubIndexAffiche === null) {
                // Premier affichage : pas d'animation, tout se place directement
                slides.forEach(function(s, i) {
                    positionnerPubSlide(s, i === pubCourante ? "centre" : "droite", true);
                });
                pubIndexAffiche = pubCourante;
                return;
            }

            if (pubIndexAffiche === pubCourante) { return; }

            var slideSortante = slides[pubIndexAffiche];
            var slideEntrante = slides[pubCourante];
            var sens = direction === "arriere" ? "arriere" : "avant";

            if (sens === "arriere") {
                positionnerPubSlide(slideEntrante, "gauche", true);
                positionnerPubSlide(slideSortante, "droite");
                positionnerPubSlide(slideEntrante, "centre");
            } else {
                positionnerPubSlide(slideEntrante, "droite", true);
                positionnerPubSlide(slideSortante, "gauche");
                positionnerPubSlide(slideEntrante, "centre");
            }

            // Les slides non concernées restent prêtes à droite pour un futur passage
            slides.forEach(function(s, i) {
                if (i !== pubIndexAffiche && i !== pubCourante) {
                    positionnerPubSlide(s, "droite", true);
                }
            });

            pubIndexAffiche = pubCourante;
        }

        function planifierPub() {
            if (minuteurPub) { clearInterval(minuteurPub); minuteurPub = null; }
            if (rechercheActive || toutesLesPubs.length <= 1) { return; }
            minuteurPub = setInterval(function() {
                pubCourante = (pubCourante + 1) % toutesLesPubs.length;
                afficherPubCourante("avant");
            }, 5000);
        }

        function allerAPub(index, direction) {
            var ancien = pubCourante;
            var nouveau = (index + toutesLesPubs.length) % toutesLesPubs.length;
            if (!direction) {
                direction = (nouveau > ancien) ? "avant" : "arriere";
            }
            pubCourante = nouveau;
            afficherPubCourante(direction);
            planifierPub();
        }

        // Affiche ou masque la bannière pub selon qu'une recherche est active ou non
        function miseAJourAffichagePub() {
            var section = document.getElementById("pub_carousel");
            if (!section) return;

            if (rechercheActive || toutesLesPubs.length === 0) {
                section.style.display = "none";
                if (minuteurPub) { clearInterval(minuteurPub); minuteurPub = null; }
            } else {
                section.style.display = "block";
                planifierPub();
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            var btnPrec = document.querySelector(".pub-precedent");
            var btnSuiv = document.querySelector(".pub-suivant");
            if (btnPrec) btnPrec.addEventListener("click", function() { allerAPub(pubCourante - 1, "arriere"); });
            if (btnSuiv) btnSuiv.addEventListener("click", function() { allerAPub(pubCourante + 1, "avant"); });
        });

        // Pré-sélectionne la catégorie si elle est passée dans l'URL (ex: ?categorie=Informatique)
        function appliquerCategorieDepuisURL() {
            var params = new URLSearchParams(window.location.search);
            var categorie = params.get("categorie");
            if (categorie) {
                document.getElementById("select_categorie").value = categorie;
                return true;
            }
            return false;
        }

        // ══════════════════════════════════════
        // AFFICHAGE PROGRESSIF DE LA GRILLE
        // On ne construit qu'un petit lot de cartes (donc de photos) au départ,
        // puis on ajoute le lot suivant seulement quand l'utilisateur approche
        // du bas de la grille : les photos se chargent au fur et à mesure
        // qu'il les découvre, au lieu que tout arrive d'un coup.
        // ══════════════════════════════════════
        var TAILLE_LOT = 12;
        var articlesFiltresActuels = [];
        var nombreArticlesAffiches = 0;
        var sentinelleChargement = null;
        var observateurChargement = null;

        function creerCarteArticle(article) {
            var carte = document.createElement("div");
            carte.className = "carte-article";

            var photos = (article.photos && article.photos.length) ? article.photos : (article.photo ? [article.photo] : []);
            var photoPrincipale = photos[0];

            var photoHTML = photoPrincipale
                ? "<div class='carte-image'><img src='" + photoPrincipale + "' alt='" + article.nom + "' loading='lazy'>" +
                  (photos.length > 1 ? "<span class='badge-photos'>📷 " + photos.length + "</span>" : "") +
                  "</div>"
                : "<div class='no-photo'></div>";

            var prixFormate = article.prix
                ? parseInt(article.prix).toLocaleString("fr-FR") + " FCFA"
                : "Prix non défini";

            var enRupture = article.stock === "rupture";
            var badgeStockHTML = enRupture
                ? "<span class='badge-stock-client rupture'> Rupture de stock</span>"
                : "<span class='badge-stock-client disponible'> Disponible</span>";

            var aDesVariantes = (article.tailles && article.tailles.length) || (article.couleurs && article.couleurs.length);
            var badgeVariantesHTML = aDesVariantes
                ? "<span class='badge-variantes-client'> Choix disponibles</span>"
                : "";

            carte.innerHTML =
                photoHTML +
                "<div class='carte-info'>" +
                "<div class='carte-categorie'>" + (article.categorie || "Autre") + "</div>" +
                "<div class='carte-nom'>" + article.nom + "</div>" +
                "<div class='carte-desc'>" + (article.description || "") + "</div>" +
                "<div class='carte-prix'>" + prixFormate + "</div>" +
                badgeStockHTML + badgeVariantesHTML +
                "<button type='button' class='carte-btn' onclick=\"ouvrirCommande('" + article.id + "')\">" +
                " Commander</button>" +
                "</div>";

            if (photos.length > 0) {
                var zoneImage = carte.querySelector(".carte-image, .no-photo");
                zoneImage.style.cursor = "pointer";
                zoneImage.addEventListener("click", function() {
                    ouvrirGalerie(photos, article.nom);
                });
            }

            return carte;
        }

        // Ajoute le prochain lot de cartes juste avant la sentinelle
        function chargerLotSuivant() {
            var grille = document.getElementById("grille-articles");
            var prochain = articlesFiltresActuels.slice(nombreArticlesAffiches, nombreArticlesAffiches + TAILLE_LOT);

            prochain.forEach(function(article) {
                grille.insertBefore(creerCarteArticle(article), sentinelleChargement);
            });

            nombreArticlesAffiches += prochain.length;

            // Plus rien à charger : on retire la sentinelle
            if (nombreArticlesAffiches >= articlesFiltresActuels.length && observateurChargement) {
                observateurChargement.disconnect();
            }
        }

        function initSentinelleChargement() {
            var grille = document.getElementById("grille-articles");

            sentinelleChargement = document.createElement("div");
            sentinelleChargement.className = "sentinelle-chargement";
            sentinelleChargement.style.cssText = "grid-column:1/-1; height:1px;";
            grille.appendChild(sentinelleChargement);

            if (observateurChargement) observateurChargement.disconnect();

            if ("IntersectionObserver" in window) {
                observateurChargement = new IntersectionObserver(function(entrees) {
                    entrees.forEach(function(entree) {
                        if (entree.isIntersecting) chargerLotSuivant();
                    });
                }, { rootMargin: "400px" });
                observateurChargement.observe(sentinelleChargement);
            } else {
                // Navigateur sans IntersectionObserver : on affiche tout d'un coup
                chargerLotSuivant();
            }
        }

        // Afficher les articles dans la grille (remplace le contenu et repart de zéro)
        function afficherArticles(articles) {
            var grille = document.getElementById("grille-articles");
            var compteur = document.getElementById("compteur");

            if (observateurChargement) observateurChargement.disconnect();

            if (articles.length === 0) {
                grille.innerHTML =
                    "<div class='aucun-article' style='grid-column:1/-1;'>" +
                    "<div style='font-size:48px;'>🛒</div>" +
                    "<p>Aucun article disponible pour le moment.<br>" +
                    "Revenez bientôt !</p></div>";
                compteur.textContent = "";
                return;
            }

            compteur.textContent = articles.length + " article(s) trouvé(s)";
            grille.innerHTML = "";

            articlesFiltresActuels = articles;
            nombreArticlesAffiches = 0;

            initSentinelleChargement();
            chargerLotSuivant();
        }

        // ══════════════════════════════════════
        // GALERIE PHOTOS PLEIN ÉCRAN
        // ══════════════════════════════════════
        var galeriePhotosActuelles = [];
        var galerieIndexActuel = 0;

        window.ouvrirGalerie = function(photos, nomArticle) {
            galeriePhotosActuelles = photos;
            galerieIndexActuel = 0;
            document.getElementById("galerie_titre").textContent = nomArticle;
            afficherPhotoGalerie();
            document.getElementById("galerie_overlay").classList.add("ouverte");
        };

        window.fermerGalerie = function() {
            document.getElementById("galerie_overlay").classList.remove("ouverte");
        };

        window.naviguerGalerie = function(delta) {
            var total = galeriePhotosActuelles.length;
            galerieIndexActuel = (galerieIndexActuel + delta + total) % total;
            afficherPhotoGalerie();
        };

        function afficherPhotoGalerie() {
            document.getElementById("galerie_image_active").src = galeriePhotosActuelles[galerieIndexActuel];

            var miniatures = document.getElementById("galerie_miniatures");
            miniatures.innerHTML = "";
            miniatures.style.display = galeriePhotosActuelles.length > 1 ? "flex" : "none";

            galeriePhotosActuelles.forEach(function(src, index) {
                var mini = document.createElement("img");
                mini.src = src;
                mini.className = index === galerieIndexActuel ? "active" : "";
                mini.onclick = function() { galerieIndexActuel = index; afficherPhotoGalerie(); };
                miniatures.appendChild(mini);
            });
        }

        document.addEventListener("keydown", function(e) {
            if (!document.getElementById("galerie_overlay").classList.contains("ouverte")) return;
            if (e.key === "Escape") fermerGalerie();
            if (e.key === "ArrowLeft") naviguerGalerie(-1);
            if (e.key === "ArrowRight") naviguerGalerie(1);
        });

        // ══════════════════════════════════════
        // FENÊTRE DE COMMANDE : présentation vendeur + article,
        // avec bouton final vers WhatsApp
        // ══════════════════════════════════════
        window.ouvrirCommande = function(idArticle) {
            var article = tousLesArticles.filter(function(a){ return a.id === idArticle; })[0];
            if (!article) return;

            articleCommandeActuel = article;

            var photos = (article.photos && article.photos.length) ? article.photos : (article.photo ? [article.photo] : []);
            var photoPrincipale = photos[0];

            document.getElementById("commande_haut").innerHTML = photoPrincipale
                ? "<img src='" + photoPrincipale + "' alt='" + article.nom + "'>" +
                  "<button type='button' class='commande-fermer' onclick='fermerCommande()' aria-label='Fermer'>✕</button>"
                : "<div class='no-photo'>📦</div>" +
                  "<button type='button' class='commande-fermer' onclick='fermerCommande()' aria-label='Fermer'>✕</button>";

            document.getElementById("commande_nom").textContent = article.nom;

            var prixFormate = article.prix
                ? parseInt(article.prix).toLocaleString("fr-FR") + " FCFA"
                : "Prix non défini";
            document.getElementById("commande_prix").textContent = prixFormate;

            var enRupture = article.stock === "rupture";
            var badgeStock = document.getElementById("commande_stock");
            badgeStock.textContent = enRupture ? " Rupture de stock" : " Disponible";
            badgeStock.className = "badge-stock-client " + (enRupture ? "rupture" : "disponible");

            document.getElementById("commande_desc").textContent = article.description || "";

            // Listes déroulantes taille / couleur (affichées seulement si le vendeur les a renseignées)
            remplirListeChoix("commande_zone_taille", "commande_taille", article.tailles);
            remplirListeChoix("commande_zone_couleur", "commande_couleur", article.couleurs);

            // Infos vendeur (photo si disponible)
            var vendeurInfo = vendeursParEmail[(article.vendeurEmail || "").trim().toLowerCase()];
            var zonePhotoVendeur = document.getElementById("commande_vendeur_photo");
            if (vendeurInfo && vendeurInfo.photo) {
                zonePhotoVendeur.innerHTML = "<img src='" + vendeurInfo.photo + "' class='commande-vendeur-photo' alt='" + (article.vendeur || "") + "'>";
            } else {
                zonePhotoVendeur.innerHTML = "<div class='commande-vendeur-photo-vide'>" +
                    (article.vendeur || "?").trim().charAt(0).toUpperCase() + "</div>";
            }
            document.getElementById("commande_vendeur_nom").textContent = article.vendeur || "Vendeur ESETEC";

            var btnCommander = document.getElementById("commande_lien_whatsapp");
            btnCommander.textContent = enRupture ? " Article en rupture de stock" : " Commander maintenant";

            document.getElementById("commande_overlay").classList.add("ouverte");
        };

        // Remplit un <select> avec une liste de valeurs, et cache le bloc si la liste est vide
        function remplirListeChoix(idZone, idSelect, valeurs) {
            var zone = document.getElementById(idZone);
            var select = document.getElementById(idSelect);
            if (!valeurs || valeurs.length === 0) {
                zone.style.display = "none";
                select.innerHTML = "";
                return;
            }
            zone.style.display = "block";
            select.innerHTML = valeurs.map(function(v) {
                return "<option value='" + v + "'>" + v + "</option>";
            }).join("");
        }

        // Construit le message WhatsApp (avec la taille/couleur choisies) et ouvre WhatsApp
        window.confirmerCommande = function() {
            var article = articleCommandeActuel;
            if (!article) return;

            var prixFormate = article.prix
                ? parseInt(article.prix).toLocaleString("fr-FR") + " FCFA"
                : "Prix non défini";

            var precisions = "";
            var selectTaille  = document.getElementById("commande_taille");
            var selectCouleur = document.getElementById("commande_couleur");
            if (article.tailles && article.tailles.length) {
                precisions += "\nTaille souhaitée : " + selectTaille.value;
            }
            if (article.couleurs && article.couleurs.length) {
                precisions += "\nCouleur souhaitée : " + selectCouleur.value;
            }

            var msgWhatsApp =
                "Bonjour, je suis intéressé(e) par votre article *" + article.nom +
                "* (" + prixFormate + ") affiché sur ESETEC Marketplace." +
                precisions +
                "\nEst-il encore disponible ?";

            var lienWhatsApp = "https://api.whatsapp.com/send?phone=" +
                (article.whatsapp || "").replace(/[^0-9]/g, "") +
                "&text=" + encodeURIComponent(msgWhatsApp);

            window.open(lienWhatsApp, "_blank");
        };

        window.fermerCommande = function() {
            document.getElementById("commande_overlay").classList.remove("ouverte");
        };

        document.addEventListener("keydown", function(e) {
            if (!document.getElementById("commande_overlay").classList.contains("ouverte")) return;
            if (e.key === "Escape") fermerCommande();
        });

        // Filtrer par nom et catégorie
        window.filtrerArticles = function() {
            var recherche  = document.getElementById("input_recherche").value.toLowerCase();
            var categorie  = document.getElementById("select_categorie").value;

            // La bannière pub disparaît dès qu'une recherche par nom ou catégorie est active
            rechercheActive = !!(recherche.trim() || categorie);
            miseAJourAffichagePub();

            var filtres = tousLesArticles.filter(function(a) {
                var nomOk = a.nom.toLowerCase().includes(recherche) ||
                            (a.description || "").toLowerCase().includes(recherche);
                var catOk = !categorie || a.categorie === categorie;
                return nomOk && catOk;
            });

            afficherArticles(filtres);
        };

    </script>

    <!-- BASCULE "MON COMPTE" DANS LA BARRE DE NAVIGATION -->
    <script>
        (function () {
            try {
                var connecte = localStorage.getItem("esetec_vendeur_id");
                var lien = document.getElementById("nav_espace_vendeur");
                if (connecte && lien) {
                    lien.textContent = " Mon compte";
                    lien.classList.add("nav-mon-compte");
                }
            } catch (e) {}
        })();
    </script>
